<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8c1d40">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<title>גלגל הדייטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: one column; the wheel is the hero, the result under it, the two lists (still in the wheel / done) below */
  :root {
    --bg: #fbf3f1; --surface: #ffffff; --line: #ecd9d6; --fg: #2b1620; --muted: #7d6570;
    --wine: #8c1d40; --rose: #e86a7f; --peach: #f4a582; --gold: #d9a441; --plum: #5b2a4e;
    --ink-on: #ffffff; --shadow: 0 10px 30px rgba(92, 25, 50, .14);
    --display: 'Suez One', 'Assistant', Georgia, serif; --body: 'Assistant', 'Segoe UI', Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1a0e14; --surface: #26151d; --line: #3d2530; --fg: #f7e9ec; --muted: #b997a4;
    --wine: #d24a6f; --rose: #ef7f93; --peach: #f2a98b; --gold: #e2b356; --plum: #8e4f7d; --shadow: 0 10px 30px rgba(0,0,0,.4); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #1a0e14; --surface: #26151d; --line: #3d2530; --fg: #f7e9ec; --muted: #b997a4;
    --wine: #d24a6f; --rose: #ef7f93; --peach: #f2a98b; --gold: #e2b356; --plum: #8e4f7d; --shadow: 0 10px 30px rgba(0,0,0,.4); color-scheme: dark; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 400 17px/1.5 var(--body); direction: rtl; }
  .wrap { max-width: 560px; margin: 0 auto; padding-block: 22px 48px; padding-inline: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .wrap > * { min-width: 0; }
  header { text-align: center; }
  h1 { margin: 0; font: 400 2.3rem/1.1 var(--display); color: var(--wine); text-wrap: balance; }
  .count { margin: 6px 0 0; color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
  .stage { position: relative; width: min(100%, 420px); margin: 0 auto; aspect-ratio: 1; max-width: 100%; }
  canvas { width: 100%; height: 100%; display: block; }
  .pin { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 34px; height: 44px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
  .hub { position: absolute; inset: 0; margin: auto; width: 26%; aspect-ratio: 1; border-radius: 50%; border: 0; background: var(--wine); color: var(--ink-on); font: 400 1.35rem/1 var(--display); box-shadow: 0 0 0 6px var(--surface), var(--shadow); cursor: pointer; }
  .hub:disabled { opacity: .75; cursor: default; }
  .hub:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .result { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; text-align: center; box-shadow: var(--shadow); }
  .result small { display: block; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
  .result p { margin: 6px 0 0; font: 400 1.6rem/1.3 var(--display); color: var(--fg); text-wrap: balance; }
  .result .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 9px 18px; font: 700 .95rem var(--body); cursor: pointer; }
  .btn.primary { background: var(--wine); border-color: var(--wine); color: var(--ink-on); }
  .empty { text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--fg); font-size: 1.1rem; }
  details { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; }
  summary { cursor: pointer; padding: 12px 0; font-weight: 800; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
  summary::-webkit-details-marker { display: none; }
  summary span { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 2px; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  li .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li .d { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
  li .mini { flex: none; border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 4px 10px; font: 600 .82rem var(--body); cursor: pointer; }
  li .mini.warn { color: var(--wine); border-color: var(--wine); }
  .add { display: flex; gap: 8px; margin: 4px 0 14px; }
  .add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 12px; padding: 9px 12px; font: inherit; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .cat { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 14px; font: 700 .92rem var(--body); cursor: pointer; }
  .cat i, li i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .cat[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .cat.off { opacity: .45; }
  .add { flex-wrap: wrap; }
  .add select { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 12px; padding: 9px 10px; font: inherit; }
  .note { color: var(--muted); font-size: .85rem; text-align: center; margin: 0; }
  /* romance: a blush wash, hearts drifting up behind everything, and a photo of the two of you when there is one */
  :root { --veil-top: rgba(251, 243, 241, .35); --blush: rgba(232, 106, 127, .22); --veil: rgba(251, 243, 241, .72); --glass: rgba(255, 255, 255, .86); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --veil-top: rgba(26, 14, 20, .4); --blush: rgba(210, 74, 111, .25); --veil: rgba(26, 14, 20, .72); --glass: rgba(38, 21, 29, .86); } }
  :root[data-theme="dark"] { --veil-top: rgba(26, 14, 20, .4); --blush: rgba(210, 74, 111, .25); --veil: rgba(26, 14, 20, .72); --glass: rgba(38, 21, 29, .86); }
  body { background: radial-gradient(120% 70% at 50% 0%, var(--blush), transparent 70%), var(--bg); min-height: 100%; }
  .photo { position: fixed; inset: 0; z-index: 0; background: 50% 40% / cover no-repeat; pointer-events: none; }
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, var(--veil-top), var(--veil) 45%, var(--bg) 95%); }
  .hearts { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .hearts span { position: absolute; bottom: -40px; color: var(--rose); opacity: 0; animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(0) rotate(-10deg); opacity: 0; } 10% { opacity: .55; } 90% { opacity: .35; } 100% { transform: translateY(-110vh) rotate(14deg); opacity: 0; } }
  .wrap { position: relative; z-index: 1; }
  .result, details, .cat { background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .us { display: block; width: 132px; height: 132px; margin: 12px auto 0; border-radius: 50%; background: 31% 50% / 220% auto no-repeat; border: 4px solid var(--surface); box-shadow: 0 0 0 3px var(--rose), var(--shadow); }
  .tagline { margin: 2px 0 0; color: var(--rose); font-size: 1.1rem; letter-spacing: .4em; }
  .pin { width: 40px; height: 40px; top: -14px; }
  .hub { background: none; box-shadow: none; display: grid; place-items: center; width: 30%; border-radius: 0; padding: 0; }
  .hub svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 6px 12px rgba(92, 25, 50, .35)); }
  .hub svg path { fill: var(--wine); stroke: var(--surface); stroke-width: 2.2; }
  .hub span { position: relative; margin-top: -8%; }
  .hub:not(:disabled):hover svg { transform: scale(1.05); }
  .hub svg { transition: transform .2s; }
  .burst { position: absolute; left: 50%; top: 50%; color: var(--rose); pointer-events: none; animation: burst 1.3s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes burst { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2) rotate(var(--r)); opacity: 0; } }
  /* the big reveal: what came out, across the whole screen */
  .reveal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px max(24px, env(safe-area-inset-bottom, 0px)); background: var(--veil); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: fade .35s ease-out; }
  .reveal .card { width: min(100%, 520px); text-align: center; background: var(--glass); border: 2px solid var(--rose); border-radius: 32px; padding: 34px 22px 26px; box-shadow: 0 24px 60px rgba(92, 25, 50, .3); animation: pop .6s cubic-bezier(.2, 1.4, .4, 1); }
  .reveal .big-heart { font-size: 3.4rem; line-height: 1; color: var(--rose); animation: beat 1.1s ease-in-out infinite; }
  .reveal small { display: block; margin-top: 10px; color: var(--muted); font-weight: 800; letter-spacing: .06em; }
  .reveal h2 { margin: 8px 0 0; font: 400 clamp(2.2rem, 9vw, 3.6rem)/1.15 var(--display); color: var(--wine); text-wrap: balance; overflow-wrap: anywhere; }
  .reveal .tag { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); font-weight: 700; }
  .reveal .tag i { width: 12px; height: 12px; border-radius: 50%; }
  .reveal .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  .reveal .btn { padding: 12px 22px; font-size: 1.05rem; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .hearts { display: none; } .burst { display: none; } .reveal, .reveal .card, .reveal .big-heart { animation: none; } }
</style>
</head>
<body>
<div class="photo" id="photo" hidden></div>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<div class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="revealText" hidden>
  <div class="card">
    <div class="big-heart" aria-hidden="true">♥</div>
    <small>יצא לכם</small>
    <h2 id="revealText"></h2>
    <span class="tag" id="revealTag"><i id="revealDot"></i><span id="revealCat"></span></span>
    <div class="acts"><button class="btn primary" id="revealOk" type="button">יאללה!</button><button class="btn" id="revealAgain" type="button">עוד סיבוב</button><button class="btn" id="revealUndo" type="button">להחזיר לגלגל</button></div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>גלגל הדייטים</h1>
    <div class="us" id="us" role="img" aria-label="אנחנו" hidden></div>
    <p class="tagline" aria-hidden="true">♥ ♥ ♥</p>
    <p class="count" id="count">טוען את הגלגל…</p>
  </header>

  <div class="cats" id="cats" role="group" aria-label="מאיזה סוג לסובב"></div>

  <div class="stage">
    <canvas id="wheel" width="840" height="840" aria-label="גלגל עם כל הדברים שעוד לא עשינו"></canvas>
    <svg class="pin" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 38 C8 28 2 21 2 13 C2 7 6.5 3 12 3 C15.6 3 18.4 5 20 8 C21.6 5 24.4 3 28 3 C33.5 3 38 7 38 13 C38 21 32 28 20 38Z" fill="var(--gold)" stroke="var(--surface)" stroke-width="2.5"/></svg>
    <button class="hub" id="spin" type="button" disabled><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 37 C8 28 2 21 2 13 C2 7 6.5 3 12 3 C15.6 3 18.4 5 20 8 C21.6 5 24.4 3 28 3 C33.5 3 38 7 38 13 C38 21 32 28 20 37Z"/></svg><span>סובבו</span></button>
  </div>

  <section class="result" id="result" aria-live="polite">
    <div class="empty" id="emptyState"><b>הגלגל עוד ריק</b>הרשימות שלכם יופיעו כאן ברגע שיתווספו. אפשר גם להוסיף דבר אחד בעצמכם למטה, ב"מה עוד בגלגל".</div>
    <div id="picked" hidden>
      <small>יצא לכם · <span id="pickedCat"></span></small>
      <p id="pickedText"></p>
      <div class="acts"><button class="btn primary" id="again" type="button">עוד סיבוב</button><button class="btn" id="undo" type="button">להחזיר לגלגל</button></div>
    </div>
  </section>

  <details id="leftBox">
    <summary>מה עוד בגלגל <span id="leftN"></span></summary>
    <form class="add" id="addForm"><input id="addText" type="text" maxlength="140" placeholder="להוסיף רעיון לגלגל" autocomplete="off"><select id="addCat" aria-label="סוג"></select><button class="btn primary" type="submit">הוספה</button></form>
    <ul id="leftList"></ul>
  </details>

  <details id="doneBox">
    <summary>מה כבר יצא <span id="doneN"></span></summary>
    <ul id="doneList"></ul>
  </details>

  <p class="note" id="note">מה שיוצא יורד מהגלגל אצל שניכם.</p>
</div>

<script>
(function () {
  'use strict';
  // the four lists from the couple's two pages; each has its own color on the wheel
  var CATS = [['plan', 'דורש לתכנן', '--wine'], ['home', 'בבית', '--plum'], ['cheap', 'בתקציב זול', '--peach'], ['pricey', 'בתקציב יקר', '--gold']];
  var CAT = {}; CATS.forEach(function (c) { CAT[c[0]] = { name: c[1], color: c[2] }; });
  var only = {}; // categories picked for tonight; empty = all
  try { only = JSON.parse(localStorage.getItem('wheel.only') || '{}') || {}; } catch (e) {}
  function catColor(x) { return CAT[x.cat] ? CAT[x.cat].color : '--rose'; }
  var cv = document.getElementById('wheel'), ctx = cv.getContext('2d');
  var items = [], col = null, angle = 0, spinning = false, lastPick = null, armed = null;
  var $ = function (id) { return document.getElementById(id); };
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function anyOnly() { return Object.keys(only).some(function (k) { return only[k]; }); }
  function inPlay(x) { return !anyOnly() || only[x.cat]; }
  function left() { return items.filter(function (x) { return !x.done && inPlay(x); }).sort(function (a, b) { return a.order - b.order; }); }
  function allLeft() { return items.filter(function (x) { return !x.done; }); }
  function done() { return items.filter(function (x) { return x.done; }).sort(function (a, b) { return (b.pickedAt || 0) - (a.pickedAt || 0); }); }

  // ---------- the wheel ----------
  function short(t, n) { t = String(t); return t.length > n ? t.slice(0, n - 1) + '…' : t; }
  function heart(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s * .9);
    ctx.bezierCurveTo(x - s * 1.4, y, x - s * .9, y - s * 1.1, x, y - s * .35);
    ctx.bezierCurveTo(x + s * .9, y - s * 1.1, x + s * 1.4, y, x, y + s * .9); ctx.closePath();
  }
  function draw() {
    var L = left(), n = L.length, W = cv.width, R = W / 2 - 10, c = W / 2;
    ctx.clearRect(0, 0, W, W);
    ctx.save(); ctx.translate(c, c);
    ctx.beginPath(); ctx.arc(0, 0, R + 6, 0, Math.PI * 2); ctx.fillStyle = css('--surface'); ctx.fill();
    if (!n) {
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = css('--line'); ctx.fill();
      ctx.restore(); return;
    }
    var step = Math.PI * 2 / n, labels = n <= 24, size = n <= 8 ? 30 : n <= 14 ? 25 : 20;
    for (var i = 0; i < n; i++) {
      var a0 = angle + i * step - Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a0, a0 + step); ctx.closePath();
      ctx.fillStyle = css(catColor(L[i])); ctx.fill();
      ctx.strokeStyle = css('--surface'); ctx.lineWidth = n > 40 ? 1.5 : 3; ctx.stroke();
      if (n <= 60) { // a small heart near the rim of every slice
        ctx.save(); ctx.rotate(a0 + step / 2); ctx.translate(R - 22, 0); ctx.rotate(Math.PI / 2);
        heart(0, 0, n <= 24 ? 11 : 8); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill(); ctx.restore();
      }
      if (labels) {
        ctx.save(); ctx.rotate(a0 + step / 2);
        ctx.fillStyle = '#fff'; ctx.font = '700 ' + size + 'px Assistant, Arial, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
        ctx.fillText(short(L[i].text, n <= 8 ? 20 : 16), R - 50, 0);
        ctx.restore();
      }
    }
    ctx.restore();
  }
  // which slice sits under the pin at the top
  function underPin() { var n = left().length, step = Math.PI * 2 / n, a = ((-angle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2); return Math.floor(a / step) % n; }

  function spin() {
    var L = left(); if (spinning || !L.length || !col) return;
    spinning = true; $('spin').disabled = true; $('again').disabled = true;
    var n = L.length, step = Math.PI * 2 / n, target = Math.floor(Math.random() * n);
    var jitter = (Math.random() - .5) * step * .7, spins = 5 + Math.floor(Math.random() * 3);
    // final angle puts the middle of the target slice under the pin
    var base = -(target * step + step / 2) + jitter, from = angle, cur = ((from % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    var to = from - cur + base - spins * Math.PI * 2; while (to > from - Math.PI * 4) to -= Math.PI * 2;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, dur = reduce ? 600 : 4800, t0 = null, pick = L[target];
    function frame(now) {
      if (t0 === null) t0 = now;
      var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      angle = from + (to - from) * e; draw();
      if (k < 1) return requestAnimationFrame(frame);
      spinning = false; land(L[underPin()] || pick);
    }
    requestAnimationFrame(frame);
  }
  // hearts fly out of the middle of the wheel when it stops
  function burst() {
    var st = document.querySelector('.stage');
    for (var i = 0; i < 18; i++) {
      var h = document.createElement('span'), a = i / 18 * Math.PI * 2 + Math.random() * .3, d = 120 + Math.random() * 110;
      h.className = 'burst'; h.textContent = '♥'; h.style.fontSize = (16 + Math.random() * 22) + 'px';
      h.style.setProperty('--x', Math.cos(a) * d + 'px'); h.style.setProperty('--y', Math.sin(a) * d + 'px'); h.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
      if (i % 3 === 0) h.style.color = 'var(--gold)';
      st.appendChild(h); setTimeout(h.remove.bind(h), 1400);
    }
  }
  function showReveal(it) {
    $('revealText').textContent = it.text;
    var c = CAT[it.cat]; $('revealTag').hidden = !c;
    if (c) { $('revealCat').textContent = c.name; $('revealDot').style.background = 'var(' + c.color + ')'; }
    $('reveal').hidden = false; setTimeout(function () { $('revealOk').focus(); }, 50);
  }
  function hideReveal() { $('reveal').hidden = true; }
  async function land(it) {
    burst(); setTimeout(function () { showReveal(it); }, 450);
    lastPick = it;
    $('pickedText').textContent = it.text; $('pickedCat').textContent = CAT[it.cat] ? CAT[it.cat].name : ''; $('picked').hidden = false; $('emptyState').hidden = true;
    try { await col.doc(it.id).update({ done: true, pickedAt: Date.now() }); }
    catch (e) { $('note').textContent = 'לא הצלחתי להוריד את זה מהגלגל. בדקו את החיבור ונסו שוב.'; }
    $('again').disabled = false; render();
  }

  // ---------- lists ----------
  function render() {
    var L = left(), A = allLeft(), D = done();
    $('count').textContent = items.length ? (A.length ? 'נשארו ' + A.length + ' בגלגל · ' + D.length + ' כבר יצאו' : 'עשיתם הכול! ' + D.length + ' דברים יצאו') : 'הגלגל ריק בינתיים';
    $('leftN').textContent = A.length; $('doneN').textContent = D.length;
    $('spin').disabled = spinning || !L.length || !col;
    $('cats').innerHTML = CATS.map(function (c) {
      var n = A.filter(function (x) { return x.cat === c[0]; }).length, on = !!only[c[0]], off = anyOnly() && !on;
      return '<button type="button" class="cat' + (off ? ' off' : '') + '" data-c="' + c[0] + '" aria-pressed="' + on + '"><i style="background:var(' + c[2] + ')"></i>' + c[1] + ' · ' + n + '</button>';
    }).join('');
    if (!lastPick) {
      $('emptyState').innerHTML = L.length ? '<b>מוכנים?</b>לוחצים על "סובבו" באמצע הגלגל. לחיצה על סוג למעלה משאירה בגלגל רק אותו.' : A.length ? '<b>אין כרגע מהסוג שבחרתם</b>בחרו סוג אחר למעלה, או לחצו עליו שוב כדי לחזור לכל הגלגל.' : items.length ? '<b>הגלגל התרוקן</b>אפשר להחזיר דברים מ"מה כבר יצא" או להוסיף חדשים.' : '<b>הגלגל עוד ריק</b>הרשימות שלכם יופיעו כאן ברגע שיתווספו. אפשר גם להוסיף רעיון בעצמכם למטה, ב"מה עוד בגלגל".';
    }
    $('leftList').innerHTML = ''; $('doneList').innerHTML = '';
    A.slice().sort(function (a, b) { return CATS.findIndex(function (c) { return c[0] === a.cat; }) - CATS.findIndex(function (c) { return c[0] === b.cat; }); }).forEach(function (x) { $('leftList').appendChild(row(x, false)); });
    D.forEach(function (x) { $('doneList').appendChild(row(x, true)); });
    if (!spinning) draw();
  }
  function row(x, isDone) {
    var li = document.createElement('li'), dot = document.createElement('i'), t = document.createElement('span');
    dot.style.background = 'var(' + catColor(x) + ')'; li.appendChild(dot); t.className = 't'; t.textContent = x.text; li.appendChild(t);
    if (isDone && x.pickedAt) { var d = document.createElement('span'); d.className = 'd'; d.textContent = new Date(x.pickedAt).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' }); li.appendChild(d); }
    var b = document.createElement('button'); b.type = 'button'; b.className = 'mini';
    if (isDone) { b.textContent = 'להחזיר'; b.onclick = function () { setDone(x, false); }; }
    else {
      var sure = armed === x.id; b.textContent = sure ? 'בטוח? למחוק' : 'מחיקה'; if (sure) b.classList.add('warn');
      b.onclick = function () { if (armed === x.id) { armed = null; remove(x); } else { armed = x.id; render(); setTimeout(function () { if (armed === x.id) { armed = null; render(); } }, 4000); } };
    }
    li.appendChild(b); return li;
  }
  async function setDone(x, v) { try { await col.doc(x.id).update(v ? { done: true, pickedAt: Date.now() } : { done: false, pickedAt: null }); } catch (e) { $('note').textContent = 'השינוי לא נשמר. נסו שוב.'; } }
  async function remove(x) { try { await col.doc(x.id).delete(); } catch (e) { $('note').textContent = 'המחיקה לא נשמרה. נסו שוב.'; } }

  $('spin').onclick = spin;
  $('revealOk').onclick = hideReveal;
  $('revealAgain').onclick = function () { hideReveal(); $('again').onclick(); };
  $('revealUndo').onclick = function () { hideReveal(); $('undo').onclick(); };
  $('reveal').addEventListener('click', function (e) { if (e.target === this) hideReveal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('reveal').hidden) hideReveal(); });
  $('again').onclick = function () { $('picked').hidden = true; lastPick = null; render(); spin(); };
  $('undo').onclick = function () { if (lastPick) { setDone(lastPick, false); $('picked').hidden = true; lastPick = null; render(); } };
  $('addForm').addEventListener('submit', async function (e) {
    e.preventDefault(); var v = $('addText').value.trim(); if (!v || !col) return;
    $('addText').value = '';
    try { await col.add({ text: v, cat: $('addCat').value, order: Math.random(), done: false, pickedAt: null, created: Date.now() }); } catch (err) { $('addText').value = v; $('note').textContent = 'לא הצלחתי להוסיף. נסו שוב.'; }
  });
  $('addCat').innerHTML = CATS.map(function (c) { return '<option value="' + c[0] + '">' + c[1] + '</option>'; }).join('');
  $('cats').addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]'); if (!b || spinning) return;
    only[b.dataset.c] = !only[b.dataset.c];
    try { localStorage.setItem('wheel.only', JSON.stringify(only)); } catch (err) {}
    $('picked').hidden = true; lastPick = null; render();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // background: hearts drifting up, and the couple's photo when one is set
  // the photo is kept with the wheel's data, not in this public page
  function setPhoto(PHOTO) {
    if (!PHOTO) return;
    $('photo').style.backgroundImage = 'url("' + PHOTO + '")'; $('photo').hidden = false; $('us').style.backgroundImage = 'url("' + PHOTO + '")'; $('us').hidden = false;
  }
  (function () {
    var box = $('hearts'), html = '';
    for (var i = 0; i < 16; i++) {
      var s = 12 + (i * 7) % 22, left = (i * 37 + 11) % 100, dur = 14 + (i * 5) % 12, delay = -((i * 3.7) % dur);
      html += '<span style="left:' + left + '%;font-size:' + s + 'px;animation-duration:' + dur + 's;animation-delay:' + delay + 's">♥</span>';
    }
    box.innerHTML = html;
  })();

  render();
  // each wheel lives under a long secret code that is the part of the link after '#'; only people with the link can reach it
  var WID = (location.hash || '').replace(/^#/, '');
  if (!/^[A-Za-z0-9]{16,}$/.test(WID) || !window.firebase) { $('count').textContent = 'הקישור לא שלם. פתחו את הקישור המלא שקיבלתם.'; return; }
  firebase.initializeApp({ apiKey: 'AIzaSyAhHHuHhcMuiDZAnxR6LlyHporQJCn6bUw', authDomain: 'ril-ball-pythons.firebaseapp.com', projectId: 'ril-ball-pythons', storageBucket: 'ril-ball-pythons.firebasestorage.app', messagingSenderId: '31867361524', appId: '1:31867361524:web:c5c2063da8cc6cfb4ee6a1' });
  var wheel = firebase.firestore().collection('wheels').doc(WID);
  wheel.get().then(function (d) { if (d.exists) setPhoto((d.data() || {}).photo); }).catch(function () {});
  (function () {
    col = wheel.collection('items');
    col.onSnapshot(function (s) {
      items = s.docs.map(function (d) { var o = d.data() || {}; return { id: d.id, text: String(o.text || ''), cat: String(o.cat || ''), order: Number(o.order) || 0, done: !!o.done, pickedAt: o.pickedAt || 0, created: o.created || 0 }; })
        .filter(function (x) { return x.text; }).sort(function (a, b) { return a.created - b.created; });
      render();
    }, function () { $('count').textContent = 'אין גישה לגלגל'; $('note').textContent = 'החיבור לגלגל לא הצליח. בדקו שהקישור מלא ורעננו את הדף.'; });
  })();
})();
</script>
