<head>

<title>RIL_BALL_PYTHONS</title>
<style>html{background:#000}</style><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RIL_BALL_PYTHONS"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    color-scheme: dark;
    --bg: #000; --surface: #0e0e0e; --surface2: #181818; --line: #2a2a2a;
    --text: #F5F5F5; --muted: #ababab; --dim: #7d7d7d;
    --accent: #F5F5F5; --accent-ink: #000; --accent-soft: rgba(255,255,255,.12);
    --green: #7DB58A; --green-soft: rgba(125,181,138,.16);
    --amber: #E2A93B; --amber-soft: rgba(226,169,59,.16);
    --red: #E5776B; --red-soft: rgba(229,119,107,.16);
    --blue: #6BA6D9; --teal: #5CC5BF; --plum: #C58BD6;
    --shadow: 0 10px 30px rgba(0,0,0,.75);
    --sans: 'Rubik', 'Heebo', -apple-system, 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
  }  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; direction: rtl; }
  /* keep the app still on phones: no zoom, no sideways drift, no bounce or pull-to-refresh; lists still scroll up and down */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: pan-x pan-y; overflow-x: hidden; overscroll-behavior: none; }
  body { overflow-x: clip; overscroll-behavior: none; }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--logo) center 45% / min(125vw, 820px) auto no-repeat; filter: blur(9px); opacity: .42; }
  /* cards inside the page are glass, so the blurred logo shows through them; sheets and the nav stay solid */
  .app { --surface: rgba(14,14,14,.62); --surface2: rgba(24,24,24,.62); }
  body.home::before { display: none; }
  html { background: var(--bg); }
  body { background: transparent; color: var(--text); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app { max-width: 600px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
  .head { padding: 26px 0 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .title { font: 600 2rem/1.15 var(--sans); letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .section { margin-top: 26px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .section-title { font: 600 1.05rem var(--sans); }
  .note { font-size: .8rem; color: var(--dim); }

  /* buttons */
  .btn { border: 1px solid transparent; border-radius: 12px; padding: 12px 18px; font-weight: 600; min-height: 46px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-soft { background: var(--surface2); border-color: var(--line); }
  .btn-ghost { background: none; border-color: var(--line); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .icon-btn { width: 42px; height: 42px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; font-size: 1.05rem; }
  .icon-btn.danger { color: var(--red); }
  .linkbtn { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; text-align: center; }
  .stat b { display: block; font: 600 1.9rem/1 var(--sans); }
  .stat span { font-size: .78rem; color: var(--muted); }
  .stat.warn b { color: var(--amber); }

  /* snake cards */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: flex; align-items: stretch; overflow: hidden; }
  .card-main { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; padding: 12px; background: none; border: none; text-align: start; }
  .avatar { width: 56px; height: 56px; flex: none; border-radius: 14px; background: var(--surface2); object-fit: cover; display: flex; align-items: center; justify-content: center; font: 500 1.3rem var(--sans); color: var(--accent); }
  .card-body { min-width: 0; flex: 1; }
  .card-top { display: flex; align-items: center; gap: 7px; }
  .card-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: .68rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; flex: none; }
  .sex { color: var(--accent); font-weight: 700; flex: none; }
  .meta { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .card-side { display: flex; flex-direction: column; gap: 6px; align-items: stretch; justify-content: center; padding: 10px; border-inline-start: 1px solid var(--line); min-width: 92px; }
  .fed { font-size: .72rem; text-align: center; color: var(--muted); }
  .fed i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 5px; background: var(--dim); }
  .fed.ok i { background: var(--green); } .fed.due i { background: var(--amber); } .fed.late i { background: var(--red); }
  .mini { border: none; border-radius: 10px; padding: 8px 10px; font-size: .78rem; font-weight: 700; background: var(--green-soft); color: var(--green); }

  /* genes: chips */
  .genes { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 6px; direction: ltr; justify-content: flex-start; }
  .picked-genes { margin-top: 2px; }
  .picked-genes .note { margin-top: 6px; }
  #pg-maleId, #pg-femaleId { margin-bottom: 14px; }
  .gchip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 600; }
  .gchip.big { font-size: .92rem; padding: 5px 6px 5px 12px; }
  .gchip button { width: 24px; height: 24px; border: none; border-radius: 50%; background: none; color: inherit; padding: 0; font-size: .75rem; line-height: 1; }
  .gchip button.ctext { width: auto; height: auto; min-height: 24px; border-radius: 0; padding: 0 2px; font-size: inherit; line-height: 1.3; white-space: nowrap; }
  .gx { color: var(--dim); font-size: .85rem; }
  .ctext { border: none; background: none; color: inherit; font: inherit; padding: 0; cursor: pointer; white-space: nowrap; }
  .gchip { white-space: nowrap; flex: none; }
  .unv { color: var(--amber); font-size: .72rem; font-weight: 700; margin-inline-start: 4px; }
  .tgl { display: inline-flex; align-items: center; gap: 7px; font-size: .82rem; color: var(--muted); }
  .tgl input { width: 18px; height: 18px; accent-color: var(--accent); }
  .gchip.big .ctext { margin-inline-end: 4px; }
  .two { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
  .side-title { font: 600 1.05rem var(--sans); margin-bottom: 10px; }
  .modeRow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .modeRow:last-child { border-bottom: none; }
  .modeRow select { padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-size: .9rem; }
  #selM, #selF { font-size: 1rem; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); width: 100%; }
  @media (min-width: 700px) { .app.wide { max-width: 860px; } .two { grid-template-columns: 1fr 1fr; } }

  /* filters */
  .search { width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 7px 14px; font-size: .82rem; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  .empty { text-align: center; color: var(--muted); padding: 44px 16px; }
  .empty h3 { font: 600 1.2rem var(--sans); color: var(--text); margin-bottom: 6px; }
  .empty .btn { margin-top: 16px; }

  /* nav */
  .nav { position: fixed; inset-inline: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .nav-in { max-width: 600px; margin: 0 auto; display: flex; height: 68px; }
  .nav-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--dim); font-size: .7rem; font-weight: 500; }
  .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-btn.on { color: var(--accent); font-weight: 700; }
  .nav-btn svg .dot { fill: currentColor; stroke: none; }
  /* the "more" (three dots) menu: the less used tabs, opening above the bar */
  .nav-in { position: relative; }
  .nav-menu { position: absolute; bottom: calc(100% + 8px); inset-inline-end: 8px; min-width: 190px; padding: 6px; background: #181818; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
  .nav-mi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; background: none; border: none; border-radius: 10px; color: var(--text); font-size: .95rem; text-align: start; }
  .nav-mi svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-mi.on { background: var(--accent-soft); font-weight: 600; }

  /* sheet */
  .overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  .sheet { position: relative; width: 100%; max-width: 600px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-bottom: none; border-radius: 22px 22px 0 0; padding: 14px 18px calc(28px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); overscroll-behavior: contain; }
  /* on a computer the sheet is a centered window, so its end is visible */
  @media (min-width: 700px) {
    .overlay { align-items: center; padding: 24px 16px; box-sizing: border-box; }
    .sheet { max-height: 100%; border-bottom: 1px solid var(--line); border-radius: 22px; padding-bottom: 24px; }
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .sheet-head .acts { display: flex; gap: 8px; }
  .sheet-title { font: 600 1.5rem/1.25 var(--sans); margin: 10px 0 16px; }
  .hero { width: 100%; max-height: 240px; object-fit: cover; border-radius: 16px; margin: 8px 0; }
  .spec { background: var(--surface2); border-radius: 14px; padding: 2px 14px; margin-top: 14px; }
  .spec-row { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .spec-row:last-child { border-bottom: none; }
  .spec-row span:first-child { color: var(--muted); }
  .logrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .logrow:last-child { border-bottom: none; }
  .logrow small { display: block; color: var(--muted); }
  .banner { background: var(--red-soft); border: 1px solid var(--red); border-radius: 14px; padding: 14px; margin: 10px 0; }
  .banner .row { margin-top: 10px; }

  /* forms */
  .field, .gfield { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: .84rem; color: var(--muted); }
  .field input, .field select, .field textarea, .box { font-size: 1rem; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
  .hint { font-size: .75rem; color: var(--dim); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .group-label { font-size: .75rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; margin: 18px 0 10px; }
  .photo-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .photo-row .avatar { width: 76px; height: 76px; }

  /* gene picker */
  .gp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-height: 50px; padding: 7px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); direction: ltr; }
  .gp:focus-within { border-color: var(--accent); }
  .gp input { flex: 1 1 120px; min-width: 0; border: none; background: none; outline: none; padding: 6px 4px; font-size: 1rem; color: var(--text); }
  .gsug { margin-top: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; max-height: 230px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; direction: ltr; box-shadow: var(--shadow); }
  .gsug-item { display: block; width: 100%; min-height: 44px; text-align: start; border: none; background: none; border-radius: 9px; padding: 10px 12px; font-size: 1rem; }
  .gsug-item b { color: var(--accent); }
  .gsug-item:hover, .gsug-item.on { background: var(--accent-soft); }

  /* calculator */
  .gene-row { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .gene-row .top { display: flex; gap: 10px; align-items: flex-start; }
  .gene-row .top > div { flex: 1; min-width: 0; }
  .gene-row .sel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .gene-row .sel label { display: flex; flex-direction: column; gap: 4px; font-size: .74rem; color: var(--muted); }
  .gene-row select { padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font-size: .88rem; width: 100%; }
  .result { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .result:last-child { border-bottom: none; }
  .result .r1 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .result .pct { font: 600 1.15rem var(--sans); color: var(--accent); flex: none; }
  .bar { height: 5px; border-radius: 9px; background: var(--accent); margin-top: 7px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }

  .month { font-size: .78rem; font-weight: 700; color: var(--dim); margin: 22px 0 6px; }
  .event { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; background: none; border-inline: none; border-top: none; text-align: start; }
  .event .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); flex: none; }
  .event .body { flex: 1; min-width: 0; }
  .event .when { color: var(--dim); font-size: .78rem; flex: none; }

  /* calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cal-title { font: 600 1.55rem var(--sans); }
  .cal-tools { min-height: 30px; display: flex; justify-content: center; align-items: center; }
  .wd { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: .78rem; font-weight: 700; color: var(--dim); padding: 4px 0 6px; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; touch-action: pan-y; user-select: none; }
  .cell { background: none; border: none; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding: 6px 0 5px; min-height: 58px; color: var(--text); }
  .cell.other { color: var(--dim); opacity: .5; }
  .cell.sel { background: var(--accent-soft); }
  .cell .dn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; }
  .cell.today .dn { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .cell.sel:not(.today) .dn { box-shadow: inset 0 0 0 2px var(--accent); }
  .dots { display: flex; gap: 3px; height: 7px; align-items: center; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.k-feed, .bar.k-feed { background: var(--green); }
  .dot.k-due { background: none; box-shadow: inset 0 0 0 1.8px var(--amber); }
  .bar.k-due { background: var(--amber); }
  .dot.k-hatch, .bar.k-hatch { background: var(--accent); }
  .dot.k-custom, .bar.k-custom { background: var(--blue); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; margin-top: 12px; font-size: .74rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .ag { display: flex; align-items: stretch; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 100%; text-align: start; }
  .ag .bar { width: 4px; border-radius: 4px; flex: none; }
  .ag .agbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .ag .when { color: var(--dim); font-size: .78rem; flex: none; align-self: center; }

  /* v3 */
  .pair-card { display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: start; background: var(--surface); border: 1px solid rgba(255,255,255,.07); border-radius: 22px; padding: 16px; transition: transform .15s ease, border-color .15s ease; }
  .pair-card:active { transform: scale(.985); border-color: rgba(255,255,255,.16); }
  .pair-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .pair-top b { font-weight: 500; font-size: 1.1rem; letter-spacing: .02em; direction: ltr; unicode-bidi: isolate; }
  /* the two parents, male on the left under the male ID */
  .pair-sides { display: flex; align-items: stretch; gap: 6px; direction: ltr; }
  .pair-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; background: var(--surface2); border-radius: 16px; padding: 10px; text-align: left; }
  .pair-who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pair-side .avatar { width: 42px; height: 42px; border-radius: 12px; font-size: 1rem; }
  .pair-code { font-weight: 500; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pair-code i { font-style: normal; color: var(--muted); }
  .pair-genes { display: flex; flex-wrap: wrap; gap: 4px; }
  .pair-genes .gchip { font-size: .72rem; font-weight: 400; padding: 2px 8px; white-space: normal; flex: 0 1 auto; }
  .pair-genes .gchip.normal { background: none; border: 1px solid var(--line); color: var(--muted); }
  .pair-side .morph { margin-top: 0; font-weight: 500; font-size: .74rem; }
  .pair-side .note { direction: rtl; text-align: right; }
  .pair-x { align-self: center; color: var(--dim); font-size: .95rem; flex: none; }
  .pair-card .stage, .pair-card .note { font-weight: 400; }
  .progress { display: flex; gap: 4px; }
  .progress span { flex: 1; height: 5px; border-radius: 9px; background: var(--surface2); }
  .progress span.on { background: var(--accent); }
  .stage { align-self: flex-start; font-size: .78rem; padding: 4px 11px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
  .stage.active { background: var(--amber-soft); color: var(--amber); }
  .stage.done { background: var(--green-soft); color: var(--green); }
  .stage.failed { background: var(--red-soft); color: var(--red); }
  .morph { font-size: .8rem; color: var(--green); font-weight: 700; margin-top: 4px; direction: ltr; text-align: start; }
  .warnbox { background: var(--amber-soft); border: 1px solid var(--amber); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: .85rem; }
  .warnbox p + p { margin-top: 4px; }
  .grp { font-size: .78rem; font-weight: 700; color: var(--dim); margin: 14px 2px 0; }
  .chk { width: 24px; height: 24px; flex: none; border-radius: 8px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 600; }
  .chk.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .card.picked { border-color: var(--accent); }

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

  /* ---------- accepted morph names + checks on a snake's genetics ---------- */

    { name: 'Black Head Spider', need: ['Black Head', 'Spider'] },

    }
    function fix() {
      var y = !typing() && Math.abs(vv.scale - 1) < 0.01 ? Math.round(vv.offsetTop) : 0;
      if (Math.abs(y) < 2) y = 0;
      if (y !== last) { last = y; root.style.setProperty('--vv-y', y + 'px'); }
    }
    vv.addEventListener('resize', fix);
    vv.addEventListener('scroll', fix);
    window.addEventListener('scroll', fix, { passive: true });
    document.addEventListener('focusin', fix);
    document.addEventListener('focusout', function () { setTimeout(fix, 0); setTimeout(fix, 400); setTimeout(fix, 1000); });
  })();
  document.addEventListener('change', function (e) {
    var t = e.target;
    // calculator: picking a snake loads its genetics right away and keeps it shown as picked
    if (t.id === 'selM' || t.id === 'selF') {
      var side = t.id === 'selM' ? 'male' : 'female', ps = snakeById(t.value);
      if (side === 'male') ui.calcM = t.value; else ui.calcF = t.value;
      if (ps) { db.calc[side] = snakeCalcGenes(ps); save(); }
      renderPage();
      return;
    }
    // pairing form: show the picked snake's genetics under the picker
    if (t.form && t.form.id === 'pairForm' && (t.name === 'maleId' || t.name === 'femaleId')) {
      var pg = document.getElementById('pg-' + t.name); if (pg) pg.innerHTML = pickedGenesHtml(snakeById(t.value));
      return;
    }
    if (t.id === 'photoFile' && t.files.length) {
      var files = Array.prototype.slice.call(t.files, 0, 4 - form.photos.length); t.value = '';
      Promise.all(files.map(function (fl) { return resizeImage(fl, 640); })).then(function (list) { form.photos = form.photos.concat(list).slice(0, 4); document.getElementById('photoRow').innerHTML = photoRowInner(); }).catch(function () { toast('לא ניתן לקרוא את התמונה'); });
      return;
    }
    if (t.id === 'importFile' && t.files[0]) { importData(t.files[0]); t.value = ''; return; }
    if (t.name === 'status' && t.form && t.form.id === 'snakeForm') { refreshPriceGroup(t.value); return; }
    if (t.dataset && t.dataset.lopt) { var lo = labelOpts(); lo[t.dataset.lopt] = t.type === 'checkbox' ? t.checked : (t.dataset.lopt === 'size' ? Number(t.value) : t.value); save(); refreshLabelPreview(); return; }
    if (t.id === 'detailTgl') { db.calc.detail = t.checked; save(); calcRefresh(); return; }
    if (t.id === 'remindTgl') { db.remindFeed = t.checked; save(); toast(t.checked ? 'התזכורת פעילה' : 'התזכורת כבויה'); return; }
    if (t.dataset && t.dataset.gname != null) { db.calc.modes[t.dataset.gname] = t.value; save(); calcRefresh(); }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.id === 'snakeForm') { e.preventDefault(); saveSnake(f); }
    else if (f.id === 'eventForm') { e.preventDefault(); saveEvent(f); }
    else if (f.id === 'pairForm') { e.preventDefault(); savePair(f); }
    else if (f.id === 'feedForm') {
      e.preventDefault(); var fd = new FormData(f); var date = String(fd.get('date') || todayISO());
      var r = String(fd.get('r') || 'ate');
      addFeeding(f.dataset.id, { date: date, r: r, prey: String(fd.get('prey') || ''), size: String(fd.get('size') || ''), state: String(fd.get('state') || ''), preyG: num(fd.get('preyG')), note: String(fd.get('note') || '').trim() }, num(fd.get('weight')));
      ui.sheet = { type: 'detail', id: f.dataset.id }; renderSheet(); toast(r === 'refused' ? 'הסירוב תועד' : r === 'regurg' ? 'ההקאה תועדה' : 'ההאכלה תועדה');
    }
    else if (f.id === 'healthForm') { e.preventDefault(); saveHealth(f); }
    else if (f.id === 'incForm') { e.preventDefault(); addReading(f); }
    else if (f.id === 'weightForm') { e.preventDefault(); addWeight(f); }
    else if (f.id === 'preyForm') { e.preventDefault(); savePrey(f); }
    else if (f.id === 'goalForm') { e.preventDefault(); saveGoal(f); }
    else if (f.id === 'expenseForm') { e.preventDefault(); saveExpense(f); }
    else if (f.id === 'waitForm') { e.preventDefault(); saveWait(f); }
  });

  // swipe the month grid sideways to change month (Hebrew/RTL: a swipe to the right brings the next month)
  var swipe = null;
  document.addEventListener('touchstart', function (e) {
    var g = e.target.closest && e.target.closest('#calgrid');
    swipe = g && e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!swipe) return;
    var t = e.changedTouches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
    swipe = null;
    if (Math.abs(dx) > 50 && Math.abs(dy) < 60) calShift(dx > 0 ? 1 : -1);
  }, { passive: true });

  // iPhone Safari ignores user-scalable=no, so block its pinch-zoom gestures directly
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });

  // a label's QR opens the app at ?s=<snake id> or ?p=<pairing id>
  var deepLink = (function () { try { var q = new URLSearchParams(location.search); return q.get('s') ? { s: q.get('s') } : q.get('p') ? { p: q.get('p') } : null; } catch (e) { return null; } })();
  function openDeepLink() {
    if (!deepLink) return;
    var d = deepLink; deepLink = null;
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
    if (d.s && snakeById(d.s)) { ui.tab = 'collection'; renderPage(); openSheet({ type: 'detail', id: d.s }); }
    else if (d.p && pairOf(d.p)) { ui.tab = 'pairs'; renderPage(); openSheet({ type: 'pair', pid: d.p }); }
    else toast(d.s ? 'הנחש מהתווית לא נמצא בחשבון הזה' : 'הזיווג מהתווית לא נמצא בחשבון הזה');
  }

  renderPage();
  cloudInit();
  if (!cloud.fb) openDeepLink();
  // keep a copy of the app on the phone, so it also opens with no internet
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
})();
</script>
</body>
